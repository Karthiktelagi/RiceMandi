web:
  buildCommand: pip install -r backend/requirements.txt
  startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
  envVars:
    - key: DEBUG
      value: False
    - key: PYTHON_VERSION
      value: 3.12.0
    - key: SECRET_KEY
      generateValue: true
    - key: ALLOWED_HOSTS
      sync: false
    - key: DATABASE_URL
      fromDatabase:
        name: ricemandi-db
        property: connectionString
    - key: CSRF_TRUSTED_ORIGINS
      sync: false

databases:
  - name: ricemandi-db
    plan: free